# Deployment defintion
apiVersion: apps/v1
kind: Deployment                                 # defines the object to apply the dfinitions

metadata:                                        # metadata of the deployment
  name: flask-app                                # name of the dployment

spec:                                            # specifications of the deployment
  replicas: 5                                    # the number of replicas (instances) to deploy
  selector:
    matchLabels:                                 # match labels to find the pods
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:                                # list of containers to be deployed and containers' configs
      - name: flask-app
        image: yfrepo/simple-flask-app:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  selector:
    app: flask-app                                # Selects Pods with this label to be associated with the Service.
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: NodePort                                  # Service type that exposes your application on a static port on each node of the cluster.
